<title>Ciclo de Secado 3367</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  color-scheme: light;
  --plane:#eef2f2; --surf:#fbfcfc; --surf-2:#f5f8f8;
  --ink:#10171a; --ink-2:#4a565b; --muted:#7d8a8f;
  --grid:#e2e7e7; --rule:#c4cdcf; --hair:rgba(16,23,26,.11);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --neg:#e34948;
  --deemph:#9aa7ab;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --good-ink:#0a7a0a; --warn-ink:#8a6104; --crit-ink:#b32f2f;
  --band:rgba(42,120,214,.07); --wash:rgba(42,120,214,.10);
  --brand:#cc0000;   /* rojo Glover: sólo identidad, nunca codifica datos */
  /* escala tipografica: 6 pasos, calibrada para proyeccion */
  --t-xs:12px; --t-sm:15px; --t-md:17px; --t-lg:20px; --t-xl:28px; --t-2xl:36px;
  --f-serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  /* escala tipografica: 6 pasos, calibrada para proyeccion */
  --t-xs:12px; --t-sm:15px; --t-md:17px; --t-lg:20px; --t-xl:28px; --t-2xl:36px;
  --f-serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-disp:"IBM Plex Sans Condensed","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#0a0e10; --surf:#141b1e; --surf-2:#1a2225;
    --ink:#f2f6f6; --ink-2:#a8b6ba; --muted:#7f8d91;
    --grid:#232d31; --rule:#33403f; --hair:rgba(242,246,246,.12);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --neg:#e66767;
    --deemph:#5c6a6e;
    --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
    --good-ink:#3cc23c; --warn-ink:#fab219; --crit-ink:#e56b6b;
    --band:rgba(57,135,229,.10); --wash:rgba(57,135,229,.13);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0a0e10; --surf:#141b1e; --surf-2:#1a2225;
  --ink:#f2f6f6; --ink-2:#a8b6ba; --muted:#7f8d91;
  --grid:#232d31; --rule:#33403f; --hair:rgba(242,246,246,.12);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --neg:#e66767;
  --deemph:#5c6a6e;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --good-ink:#3cc23c; --warn-ink:#fab219; --crit-ink:#e56b6b;
  --band:rgba(57,135,229,.10); --wash:rgba(57,135,229,.13);
}
*{box-sizing:border-box}
body{background:var(--plane); color:var(--ink); font-family:var(--f-body);
  font-size:var(--t-md); line-height:1.55; -webkit-font-smoothing:antialiased;}
.page{max-width:1240px; margin:0 auto; padding:40px 28px 84px; display:flex; flex-direction:column; gap:38px;}

.masthead{display:flex; flex-direction:column; gap:14px; padding-bottom:22px; border-bottom:3px solid var(--brand);}
.brand{display:flex; align-items:center; gap:20px;}
.mark{flex:none; width:64px; height:64px; display:block; border-radius:2px; overflow:hidden;
  box-shadow:0 1px 3px rgba(16,23,26,.18);}
.mark svg, .mark img{display:block; width:100%; height:100%; object-fit:contain;}
.brandtxt{display:flex; flex-direction:column; gap:5px; min-width:0;}
.ciclosel{display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin:-14px 0 0;}
.ciclosel a{font-size:var(--t-sm); color:var(--s1); text-decoration:none; font-weight:500;}
.ciclosel a:hover{text-decoration:underline;}
.ciclosel select{font-family:var(--f-body); font-size:var(--t-sm); color:var(--ink);
  background:var(--surf); border:1px solid var(--rule); border-radius:2px; padding:7px 10px;}
.eyebrow{font-family:var(--f-disp); font-size:var(--t-xs); font-weight:600; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-2);}
.masthead h1{margin:0; font-family:var(--f-serif); font-size:clamp(34px,4.4vw,52px);
  font-weight:600; letter-spacing:-.015em; line-height:1.06; text-wrap:balance;}
.masthead h1 .sub{color:var(--muted); font-family:var(--f-mono); font-weight:400;
  font-size:.42em; letter-spacing:-.01em; vertical-align:.28em; margin-left:6px;}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:1px;
  background:var(--hair); border:1px solid var(--hair);}
.kpi{background:var(--surf); padding:16px 17px 15px; display:flex; flex-direction:column; gap:7px;}
.kpi .lbl{font-family:var(--f-disp); font-size:var(--t-xs); font-weight:600; letter-spacing:.09em;
  text-transform:uppercase; color:var(--muted); line-height:1.3;}
.kpi .val{font-size:var(--t-2xl); font-weight:600; letter-spacing:-.025em; line-height:1;}
.kpi .val .u{font-size:var(--t-sm); font-weight:500; color:var(--ink-2); letter-spacing:0; margin-left:2px;}
.kpi .note{font-size:var(--t-sm); color:var(--ink-2); line-height:1.4; margin-top:auto;}
/* el veredicto es un estado, no una magnitud: distintivo en vez de cifra */
.kpi .res{align-self:flex-start; display:inline-flex; align-items:center; gap:8px;
  font-family:var(--f-disp); font-size:var(--t-md); font-weight:600; letter-spacing:.09em;
  text-transform:uppercase; padding:6px 13px; border:2px solid currentColor; border-radius:3px;}
.kpi .res i{width:9px; height:9px; border-radius:50%; background:currentColor; flex:none;}
.kpi .res.ok{color:var(--good-ink);}
.kpi .res.no{color:var(--crit-ink);}
.kpi .flag{font-family:var(--f-disp); font-size:var(--t-xs); font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; display:flex; align-items:center; gap:5px;}
.flag .dot{width:8px; height:8px; border-radius:50%; flex:none;}
.f-good{color:var(--good-ink);} .f-good .dot{background:var(--good);}
.f-warn{color:var(--warn-ink);} .f-warn .dot{background:var(--warn);}
.f-crit{color:var(--crit-ink);} .f-crit .dot{background:var(--crit);}
.meter{height:6px; background:var(--grid); position:relative; border-radius:3px;}
.meter i{position:absolute; top:0; bottom:0; left:0; background:var(--good); border-radius:3px;}
.meter b{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink);}

.sect{display:flex; flex-direction:column; gap:18px;}
.sect > header{display:flex; flex-direction:column; gap:8px;
  padding-bottom:14px; border-bottom:1px solid var(--hair);}
.sect h2{margin:0; font-family:var(--f-serif); font-size:var(--t-xl); font-weight:600;
  letter-spacing:-.012em; line-height:1.15; color:var(--ink); text-wrap:balance;}
.sect header p{margin:0; max-width:70ch; color:var(--ink-2); font-size:var(--t-md);}
.card{background:var(--surf); border:1px solid var(--hair); padding:20px 22px 18px;
  display:flex; flex-direction:column; gap:0; position:relative;}
.card h3{margin:0 0 5px; font-size:var(--t-lg); font-weight:600; letter-spacing:-.01em;}
.card .cap{margin:0 0 14px; font-size:var(--t-sm); color:var(--ink-2); max-width:78ch;}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(410px,1fr)); gap:18px;}
.plot{overflow-x:auto;}
.plot svg{display:block; min-width:580px; width:100%; height:auto;}
.legend{display:flex; flex-wrap:wrap; gap:8px 22px; padding:13px 0 0; font-size:var(--t-sm); color:var(--ink-2);}
.legend span{display:inline-flex; align-items:center; gap:7px;}
.key{width:15px; height:3px; border-radius:2px; flex:none;}
.key.sq{width:11px; height:11px; border-radius:2px;}

.filters{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.filters .flabel{font-size:var(--t-sm); font-weight:500; color:var(--muted);}
.seg{display:flex; border:1px solid var(--rule); background:var(--surf); border-radius:2px; overflow:hidden;}
.seg button{appearance:none; border:0; background:transparent; color:var(--ink-2); cursor:pointer;
  font-family:var(--f-body); font-size:var(--t-sm); font-weight:500; padding:7px 14px;
  border-right:1px solid var(--hair);}
.seg button:last-child{border-right:0;}
.seg button:hover{background:var(--surf-2); color:var(--ink);}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--surf);}
:focus-visible{outline:2px solid var(--s1); outline-offset:2px;}

.tip{position:absolute; z-index:5; pointer-events:none; opacity:0; transition:opacity .1s;
  background:var(--surf); border:1px solid var(--rule); box-shadow:0 4px 16px rgba(0,0,0,.13);
  padding:10px 12px; font-size:var(--t-sm); min-width:180px; border-radius:2px;}
.tip.on{opacity:1;}
.tip .th{font-family:var(--f-mono); font-size:var(--t-xs); color:var(--muted); margin-bottom:6px;
  padding-bottom:5px; border-bottom:1px solid var(--hair); letter-spacing:-.02em;}
.tip .tr{display:flex; align-items:center; gap:8px; padding:2px 0;}
.tip .tr .k{flex:none;}
.tip .tr .tv{font-family:var(--f-mono); font-weight:500; font-variant-numeric:tabular-nums;
  margin-left:auto; color:var(--ink);}
.tip .tr .tn{color:var(--ink-2);}

details{border-top:1px solid var(--hair); margin-top:14px;}
summary{cursor:pointer; font-size:var(--t-sm); font-weight:500;
  color:var(--muted); padding:11px 0 0; list-style:none;}
summary::-webkit-details-marker{display:none}
summary::before{content:"+ "; font-family:var(--f-mono);}
details[open] summary::before{content:"- ";}
summary:hover{color:var(--ink);}
.tw{overflow:auto; max-height:290px; margin-top:10px;}
table{border-collapse:collapse; width:100%; font-size:var(--t-sm);}
th,td{text-align:right; padding:5px 10px 5px 0; border-bottom:1px solid var(--hair); white-space:nowrap;}
th:first-child,td:first-child{text-align:left;}
thead th{position:sticky; top:0; background:var(--surf); font-family:var(--f-disp); font-weight:600;
  font-size:var(--t-xs); letter-spacing:.07em; text-transform:uppercase; color:var(--muted);}
tbody td{font-family:var(--f-mono); font-variant-numeric:tabular-nums; color:var(--ink-2);}
tbody td:first-child{color:var(--ink);}

.foot{border-top:1px solid var(--hair); padding-top:18px; font-size:var(--t-sm); color:var(--muted); max-width:78ch;}
code{font-family:var(--f-mono); font-size:.88em; background:var(--surf-2); padding:1px 5px;
  border:1px solid var(--hair); border-radius:2px; white-space:nowrap;}
@media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
